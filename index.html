<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎄 Тайный Санта — 5 класс</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Comfortaa', system-ui, sans-serif;
    margin: 0; padding: 20px;
    background: radial-gradient(ellipse at top, #1e5631 0%, #0d2f1c 60%, #061a10 100%);
    background-attachment: fixed;
    color: #f0fff4; min-height: 100vh;
    overflow-x: hidden; position: relative;
  }
  #snow { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  .snowflake {
    position: absolute; top: -10vh; color: #fff;
    animation: fall linear infinite;
    text-shadow: 0 0 6px rgba(255,255,255,.7);
    user-select: none;
  }
  @keyframes fall {
    0%   { transform: translateY(-10vh) translateX(0) rotate(0deg); }
    100% { transform: translateY(110vh) translateX(30px) rotate(360deg); }
  }
  .container {
    max-width: 640px; margin: 0 auto;
    position: relative; z-index: 2; padding-top: 30px;
  }
  h1 {
    text-align: center; font-size: 32px; font-weight: 700;
    margin: 10px 0 6px; color: #fff;
    text-shadow: 0 0 12px rgba(255,60,60,.7), 0 0 24px rgba(255,0,0,.4);
  }
  .subtitle {
    text-align: center; color: #b8e6c1;
    font-size: 14px; margin-bottom: 24px;
    letter-spacing: 2px; text-transform: uppercase;
  }
  .card {
    background: rgba(255,255,255,.08);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.18);
    padding: 26px; border-radius: 22px;
    box-shadow: 0 12px 40px rgba(0,0,0,.35),
                inset 0 1px 0 rgba(255,255,255,.15);
    margin-bottom: 18px;
  }
  h2 {
    margin: 0 0 18px; font-size: 19px;
    color: #ffd166; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  label {
    display: block; margin-top: 14px;
    font-size: 13px; color: #b8e6c1;
    letter-spacing: 1px; text-transform: uppercase;
  }
  input {
    font-size: 16px; padding: 14px 16px;
    border-radius: 14px;
    border: 2px solid rgba(255,255,255,.2);
    background: rgba(0,0,0,.25); color: #fff;
    width: 100%; margin-top: 8px;
    font-family: inherit; transition: .2s;
  }
  input::placeholder { color: #a5d6b0; }
  input:focus {
    outline: none; border-color: #7bdc8b;
    background: rgba(0,0,0,.4);
    box-shadow: 0 0 0 4px rgba(123,220,139,.15);
  }
  button {
    font-size: 16px; padding: 14px;
    border-radius: 14px; border: none;
    width: 100%; margin-top: 12px;
    font-family: inherit; font-weight: 700;
    cursor: pointer; transition: .2s;
    background: linear-gradient(135deg, #e63946, #c1121f);
    color: #fff;
    box-shadow: 0 6px 20px rgba(230,57,70,.4);
  }
  button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 26px rgba(230,57,70,.55);
  }
  button:disabled {
    background: rgba(255,255,255,.12);
    color: rgba(255,255,255,.4);
    cursor: not-allowed; box-shadow: none;
  }
  .counter {
    text-align: center; font-size: 16px; margin: 18px 0 6px;
    padding: 14px; border-radius: 14px;
    background: rgba(0,0,0,.25);
    border: 1px solid rgba(255,255,255,.1);
  }
  .counter b { color: #7bdc8b; font-size: 26px; }
  .progress {
    height: 10px; background: rgba(0,0,0,.4);
    border-radius: 6px; overflow: hidden; margin-top: 10px;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #7bdc8b, #ffd166);
    width: 0; transition: width .4s ease;
  }
  .msg {
    margin-top: 16px; padding: 14px 16px;
    border-radius: 14px; text-align: center;
    font-weight: 600; font-size: 15px;
    background: rgba(255,209,102,.15);
    border: 1px solid rgba(255,209,102,.4);
    color: #ffd166;
  }
  .result {
    background: rgba(123,220,139,.15);
    border: 1px solid rgba(123,220,139,.5);
    color: #eaffef; font-size: 17px;
    line-height: 1.6; padding: 22px;
  }
  .result b { color: #ffd166; font-size: 22px; }
  .hidden { display: none !important; }
  .list-names { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  .chip {
    background: rgba(123,220,139,.18); color: #d4ffe0;
    border: 1px solid rgba(123,220,139,.4);
    padding: 10px 14px; border-radius: 14px;
    font-size: 14px; font-weight: 600;
    animation: pop .25s ease;
  }
  @keyframes pop {
    0% { transform: scale(.9); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .loader { text-align: center; color: #b8e6c1; padding: 10px; font-size: 14px; }
  .registered {
    text-align: center; padding: 20px;
    background: rgba(123,220,139,.15);
    border: 1px solid rgba(123,220,139,.5);
    border-radius: 14px;
    color: #eaffef; font-weight: 600;
  }
  .who-am-i {
    text-align: center;
    font-size: 15px;
    color: #b8e6c1;
    margin-bottom: 14px;
    padding: 10px;
    background: rgba(0,0,0,.2);
    border-radius: 12px;
  }
  .who-am-i b { color: #ffd166; font-size: 18px; }
</style>
</head>
<body>

<div id="snow"></div>

<div class="container">

  <h1>Тайный Санта</h1>
  <div class="subtitle">5 класс · регистрация с любого устройства</div>

  <!-- ============ ЭТАП 1 ============ -->
  <div id="stage1" class="card">
    <h2>📝 Запишись в список</h2>

    <div id="regForm">
      <label>Твоё имя</label>
      <input id="nameInput" placeholder="Например: Маша" autocomplete="off" maxlength="30">
      <button id="addBtn">✨ Записаться</button>
    </div>

    <div id="alreadyReg" class="registered hidden"></div>

    <div class="counter">
      Записано: <b id="count">0</b> / 2
      <div class="progress"><div id="progressBar" class="progress-bar"></div></div>
    </div>

    <div id="msg1" class="msg hidden"></div>
    <div id="namesList" class="list-names"></div>
    <div id="loading" class="loader">Загрузка списка…</div>
  </div>

  <!-- ============ ЭТАП 2 ============ -->
  <div id="stage2" class="card hidden">
    <h2>🎁 Узнай, кому даришь подарок</h2>

    <div id="whoAmI" class="who-am-i"></div>

    <button id="revealBtn">👀 Показать</button>

    <div id="msg2" class="msg hidden"></div>
    <button id="hideBtn" class="hidden">🙈 Я запомнил, скрыть</button>
  </div>

</div>

<script>
// ========== НАСТРОЙКА ==========
const FIREBASE_URL = 'https://secret-santa-5class-default-rtdb.europe-west1.firebasedatabase.app';
const MAX = 2;
// ===============================

const $ = id => document.getElementById(id);

// ================= СНЕЖИНКИ =================
(function makeSnow() {
  const snow = $('snow');
  const chars = ['❄', '❅', '❆', '✦', '•'];
  for (let i = 0; i < 40; i++) {
    const f = document.createElement('div');
    f.className = 'snowflake';
    f.textContent = chars[Math.floor(Math.random() * chars.length)];
    f.style.left = Math.random() * 100 + 'vw';
    f.style.fontSize = (8 + Math.random() * 18) + 'px';
    f.style.animationDuration = (6 + Math.random() * 10) + 's';
    f.style.animationDelay = (Math.random() * 10) + 's';
    f.style.opacity = 0.3 + Math.random() * 0.6;
    snow.appendChild(f);
  }
})();

// ============ СООБЩЕНИЯ ============
function showMsg(id, text, type = 'info') {
  const el = $(id);
  el.textContent = text;
  el.className = 'msg' + (type === 'result' ? ' result' : '');
  el.classList.remove('hidden');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.add('hidden'), 4000);
}

// ============ LOCALSTORAGE ============
function hasRegistered() {
  return localStorage.getItem('santa_my_name') !== null;
}
function getMyName() {
  return localStorage.getItem('santa_my_name');
}
function setMyName(name) {
  localStorage.setItem('santa_my_name', name);
}

// ============ FIREBASE API ============
async function loadParticipants() {
  try {
    const res = await fetch(`${FIREBASE_URL}/participants.json`);
    const data = await res.json();
    return data ? Object.values(data) : [];
  } catch (e) {
    console.error('Ошибка загрузки:', e);
    return [];
  }
}

async function nameExists(name) {
  const list = await loadParticipants();
  return list.some(p => p.name.toLowerCase() === name.toLowerCase());
}

async function addParticipant(name) {
  await fetch(`${FIREBASE_URL}/participants.json`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, ts: Date.now() })
  });
}

async function savePairs(pairs) {
  await fetch(`${FIREBASE_URL}/pairs.json`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(pairs)
  });
}

async function loadPairs() {
  try {
    const res = await fetch(`${FIREBASE_URL}/pairs.json`);
    return await res.json();
  } catch (e) {
    return null;
  }
}

// ============ ОТРИСОВКА ============
let participants = [];
let pairs = {};

function renderList() {
  $('count').textContent = participants.length;
  $('progressBar').style.width = Math.min(participants.length / MAX * 100, 100) + '%';

  const list = $('namesList');
  list.innerHTML = '';
  participants.forEach(p => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = `🎅 ${p.name}`;
    list.appendChild(chip);
  });
}

function showRegisteredState() {
  const name = getMyName();
  $('regForm').classList.add('hidden');
  $('alreadyReg').classList.remove('hidden');
  $('alreadyReg').innerHTML = `✅ Ты уже записан(а) как <b>${name}</b><br>Один человек — одна запись.`;
}

// ============ ПАРЫ ============
async function maybeShuffle() {
  if (participants.length !== MAX) return;
  const existing = await loadPairs();
  if (existing) { pairs = existing; showStage2(); return; }

  const shuffled = [...participants].sort(() => Math.random() - 0.5);
  const newPairs = {};
  shuffled.forEach((p, i) => {
    const target = shuffled[(i + 1) % shuffled.length];
    newPairs[p.name] = { to: target.name };
  });

  await savePairs(newPairs);
  pairs = newPairs;
  showStage2();
}

function showStage2() {
  $('stage1').classList.add('hidden');
  $('stage2').classList.remove('hidden');

  const myName = getMyName();
  const who = $('whoAmI');

  if (myName) {
    who.innerHTML = `Ты — <b>${myName}</b>`;
  } else {
    who.innerHTML = `⚠️ Ты не зарегистрирован(а) на этом устройстве.<br>Открой сайт со своего телефона, чтобы узнать свою пару.`;
    $('revealBtn').disabled = true;
  }
}

// ============ ОБНОВЛЕНИЕ ============
async function refresh() {
  participants = await loadParticipants();
  renderList();
  $('loading').classList.add('hidden');

  const existing = await loadPairs();
  if (existing) {
    pairs = existing;
    if ($('stage2').classList.contains('hidden')) {
      showStage2();
    } else {
      const myName = getMyName();
      $('whoAmI').innerHTML = myName
        ? `Ты — <b>${myName}</b>`
        : `⚠️ Ты не зарегистрирован(а) на этом устройстве.`;
    }
  } else {
    await maybeShuffle();
  }
}

setInterval(refresh, 5000);
refresh();

if (hasRegistered()) {
  showRegisteredState();
}

// ============ ДЕЙСТВИЯ ============
$('addBtn').onclick = async () => {
  if (hasRegistered()) {
    showMsg('msg1', 'Ты уже записан(а) с этого устройства!');
    return;
  }

  const name = $('nameInput').value.trim();

  if (!name) return showMsg('msg1', 'Сначала введи имя!');
  if (participants.some(p => p.name.toLowerCase() === name.toLowerCase()))
    return showMsg('msg1', 'Ой, такое имя уже записано!');
  if (participants.length >= MAX)
    return showMsg('msg1', 'Список уже полон!');

  $('addBtn').disabled = true;
  try {
    if (await nameExists(name)) {
      showMsg('msg1', 'Ой, такое имя уже записано!');
      return;
    }
    await addParticipant(name);
    setMyName(name);
    $('nameInput').value = '';
    showMsg('msg1', `✅ ${name} записан(а)!`);
    showRegisteredState();
    await refresh();
  } finally {
    $('addBtn').disabled = false;
  }
};

$('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('addBtn').click();
});

// ============ ПОКАЗ ПАРЫ ============
$('revealBtn').onclick = () => {
  const me = getMyName();

  if (!me) {
    return showMsg('msg2', 'Ты не зарегистрирован(а) на этом устройстве.');
  }

  if (!participants.some(p => p.name === me)) {
    return showMsg('msg2', 'Твоего имени нет в списке. Зарегистрируйся заново.');
  }

  const p = pairs[me];
  if (!p) return showMsg('msg2', 'Пары ещё не созданы.');

  const box = $('msg2');
  box.className = 'msg result';
  box.innerHTML = `Ты даришь подарок для <b>${p.to}</b>`;
  box.classList.remove('hidden');
  $('hideBtn').classList.remove('hidden');
};

$('hideBtn').onclick = () => {
  $('msg2').classList.add('hidden');
  $('hideBtn').classList.add('hidden');
};
</script>
</body>
</html>
